<section class="all-surveys-section">
  <nav>
    <div>
      <a href="">Active survey</a>
      <a href="">Past survey</a>
    </div>

    <div class="category-select">
      <button class="category-select__button" (click)="isActive.set(!isActive())" [class.isActive]="isActive()">
        <span
          >Sort by categories
          <div class="category-select__button--state"  [class.isActive]="isActive()">
            <img class="img-white" src="/assets/arrow_drop_down-down-white.svg" alt="" />
            <img class="img-hover" src="/assets/arrow_drop_down-down-orange.svg" alt="" />
            <img class="img-open" src="/assets/arrow_drop_down-up-orange.svg" alt="" />
          </div>
        </span>
      </button>
      <p class="used-category">{{usedCategory()}}</p>

      <ul class="category-select__list" [class.isActive]="isActive()">
        @for (categorie of categorylist; track categorie) {
            <li (click)="selectCategory(categorie)">{{categorie}}</li>
        }
      </ul>
    </div>
  </nav>
</section>
