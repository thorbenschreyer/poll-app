<header>
  <img class="header-logo" src="/assets/poll_app_logo_orange.svg" alt="Poll App" />

  <section class="main-header-section">
    <div class="header-text-section">
      <h1 class="header-h1">Collect Feedback, Unlock Ideas</h1>
      <div class="header-img-mobile-card">
      <img class="header-img-mobile" src="/assets/backgound_Animate.png" alt="">
      </div>
      <p class="header-text">
        Create and share surveys in minutes – from team events to workplace culture. Collect
        opinions, engage your audience, and turn feedback into action.
      </p>
      <div class="button-mobile-card">
      <a (click)="createSurveyService.open()" class="btn"
        >New survey <img class="btn-img" src="/assets/add_black.svg" alt=""
      /></a>
      </div>
    </div>
    <div class="header-img">
      <img class="header-img__nohover" src="/assets/backgound_noAnimate.png" alt="" />
      <img class="header-img__hover" src="/assets/backgound_Animate.png" alt="" />
    </div>
  </section>
</header>
